name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Desktop integration test
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Desktop integration test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Upload Playwright failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-failure-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm exec electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Thus-Live-Editor-${{ runner.os }}
          path: release/

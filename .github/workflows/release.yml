name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop builds run ID containing the release packages
        required: true
        type: string
      tag:
        description: Version tag; it must match package.json (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string
      release_notes:
        description: Optional Markdown release notes written by the maintainer
        required: false
        type: string
      generate_notes:
        description: Append GitHub's automatically generated change list
        required: true
        default: true
        type: boolean
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate source workflow run
        id: source
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid workflow run ID: $SOURCE_RUN_ID"
            exit 1
          fi

          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          WORKFLOW_PATH="$(jq -r '.path' <<< "$RUN_JSON")"
          EVENT="$(jq -r '.event' <<< "$RUN_JSON")"
          HEAD_BRANCH="$(jq -r '.head_branch' <<< "$RUN_JSON")"
          HEAD_SHA="$(jq -r '.head_sha' <<< "$RUN_JSON")"
          STATUS="$(jq -r '.status' <<< "$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion' <<< "$RUN_JSON")"

          if [[ "$WORKFLOW_PATH" != ".github/workflows/build.yml" ]]; then
            echo "Run $SOURCE_RUN_ID belongs to $WORKFLOW_PATH, not Desktop builds"
            exit 1
          fi
          if [[ "$EVENT" != "push" && "$EVENT" != "workflow_dispatch" ]]; then
            echo "Run $SOURCE_RUN_ID was triggered by $EVENT; only main push or manual builds are publishable"
            exit 1
          fi
          if [[ "$HEAD_BRANCH" != "main" ]]; then
            echo "Run $SOURCE_RUN_ID came from branch $HEAD_BRANCH, not main"
            exit 1
          fi
          if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
            echo "Run $SOURCE_RUN_ID is not a completed successful build"
            exit 1
          fi

          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name')"
          for PLATFORM in Windows macOS Linux; do
            if ! grep -Fxq "release-$PLATFORM-$HEAD_SHA" <<< "$ARTIFACTS"; then
              echo "Run $SOURCE_RUN_ID has no unexpired release artifact for $PLATFORM"
              exit 1
            fi
          done

          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Validate release tag and source version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      GENERATE_NOTES: ${{ inputs.generate_notes }}
      RELEASE_DRAFT: ${{ inputs.draft }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
      - name: Validate downloaded packages
        shell: bash
        run: |
          shopt -s nullglob
          WINDOWS=(release-assets/*.exe)
          MACOS=(release-assets/*.dmg)
          APPIMAGES=(release-assets/*.AppImage)
          DEBIAN=(release-assets/*.deb)
          if (( ${#WINDOWS[@]} == 0 || ${#MACOS[@]} == 0 || ${#APPIMAGES[@]} == 0 || ${#DEBIAN[@]} == 0 )); then
            echo "The selected run does not contain every required platform package"
            find release-assets -type f -print
            exit 1
          fi
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt
      - name: Create or verify release tag
        shell: bash
        run: |
          if REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            TAG_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
            TAG_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
            while [[ "$TAG_TYPE" == "tag" ]]; do
              TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA")"
              TAG_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
              TAG_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
            done
            if [[ "$TAG_TYPE" != "commit" || "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "Tag $RELEASE_TAG already exists but does not point to source commit $SOURCE_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA" > /dev/null
          fi
      - name: Create GitHub Release
        shell: bash
        run: |
          mapfile -d '' FILES < <(find release-assets -type f -print0)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release files were downloaded"
            exit 1
          fi

          SIGNING_NOTE="These packages were reused from successful Desktop builds run $SOURCE_RUN_ID at commit $SOURCE_SHA; this publishing workflow did not rebuild them. Windows packages are currently unsigned. The project is applying for free code signing provided by SignPath.io, certificate by SignPath Foundation. See https://github.com/$GITHUB_REPOSITORY/blob/$SOURCE_SHA/CODE_SIGNING_POLICY.md"
          NOTES="$SIGNING_NOTE"
          if [[ -n "$RELEASE_NOTES" ]]; then
            NOTES="$RELEASE_NOTES"$'\n\n'"$SIGNING_NOTE"
          fi

          ARGS=("$RELEASE_TAG" "${FILES[@]}" --verify-tag --notes "$NOTES" --title "Thus.Live Editor $RELEASE_TAG")
          if [[ "$GENERATE_NOTES" == "true" ]]; then
            ARGS+=(--generate-notes)
          fi
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
